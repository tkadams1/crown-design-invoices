name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency: release   # one build at a time so version numbers stay in order
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      # major.minor from package.json, patch = run number, so every push to main is a new, higher version the updater will pick up
      - name: Version
        run: |
          $v = node -e "const v=require('./package.json').version.split('.');console.log(v[0]+'.'+v[1]+'.'+process.env.GITHUB_RUN_NUMBER)"
          npm version $v --no-git-tag-version
          "VERSION=$v" >> $env:GITHUB_ENV
      - name: Tag        # GitHub only accepts a published release for a tag that already exists
        run: |
          git tag "v$env:VERSION"
          git push origin "v$env:VERSION"
      - run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
